[package]
name = "comic-reader"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "comic_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
zip = "9.4.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
quick-xml = "0.42.0"
walkdir = "2.5.0"
sha2 = "0.11.1"
uuid = { version = "1.29.1", features = ["v4"] }
regex = "1.13.1"
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dunce = "1.0.5"
unrar-rs = { version = "0.15.2", default-features = false, features = ["crypto-rust"] }
flate2 = "1.1.11"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
image = "0.25.10"
zip = "9.4.2"
